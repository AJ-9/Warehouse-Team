services:
  - type: web
    name: dispatcher-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dispatcher_app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Dispatcher2024!
      - key: FLASK_ENV
        value: production
    healthCheckPath: /login