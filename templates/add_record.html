{% extends "base.html" %}

{% block title %}Добавить запись - Диспетчерская система{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-plus"></i> Добавить новую запись</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="location" class="form-label">Локация (место выгрузки) *</label>
                            <input type="text" class="form-control" id="location" name="location" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="vehicle_number" class="form-label">Номер транспортного средства *</label>
                            <input type="text" class="form-control" id="vehicle_number" name="vehicle_number" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="queue_order" class="form-label">Очередность</label>
                            <input type="number" class="form-control" id="queue_order" name="queue_order" min="1">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Статус *</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="">Выберите статус</option>
                                {% for status in status_options %}
                                <option value="{{ status }}">{{ status }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="driver_name" class="form-label">ФИО водителя *</label>
                            <input type="text" class="form-control" id="driver_name" name="driver_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Телефон</label>
                            <input type="tel" class="form-control" id="phone" name="phone">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="supplier" class="form-label">Поставщик</label>
                            <input type="text" class="form-control" id="supplier" name="supplier">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="title" class="form-label">Титул</label>
                            <input type="text" class="form-control" id="title" name="title">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="arrival_date" class="form-label">Дата прибытия</label>
                            <input type="date" class="form-control" id="arrival_date" name="arrival_date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="arrival_time" class="form-label">Время прибытия</label>
                            <input type="time" class="form-control" id="arrival_time" name="arrival_time">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="departure_date" class="form-label">Дата убытия</label>
                            <input type="date" class="form-control" id="departure_date" name="departure_date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="departure_time" class="form-label">Время убытия</label>
                            <input type="time" class="form-control" id="departure_time" name="departure_time">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tn_number" class="form-label">Номер ТН</label>
                            <input type="text" class="form-control" id="tn_number" name="tn_number">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="comments" class="form-label">Комментарии</label>
                        <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Назад к списку
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Сохранить запись
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Устанавливаем текущую дату по умолчанию
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('arrival_date').value = today;
    
    // Устанавливаем текущее время по умолчанию
    const now = new Date();
    const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    document.getElementById('arrival_time').value = timeString;
});
</script>
{% endblock %}
