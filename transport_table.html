<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления транспортом</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.8;
            font-size: 1.1em;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(86, 171, 47, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3);
        }

        .table-container {
            overflow-x: auto;
            padding: 0 30px 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s ease;
        }

        th:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }

        th.sortable::after {
            content: " ↕";
            opacity: 0.5;
        }

        th.sort-asc::after {
            content: " ↑";
            opacity: 1;
        }

        th.sort-desc::after {
            content: " ↓";
            opacity: 1;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
            vertical-align: middle;
        }

        tr:hover {
            background: #f8f9fa;
        }

        tr:nth-child(even) {
            background: #fafbfc;
        }

        tr:nth-child(even):hover {
            background: #f1f3f4;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            display: inline-block;
            min-width: 80px;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status.cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-weight: 300;
        }

        .close {
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .close:hover {
            opacity: 0.7;
        }

        .modal-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-footer {
            padding: 20px 30px;
            background: #f8f9fa;
            border-radius: 0 0 15px 15px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            flex: 1;
            min-width: 150px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .controls {
                padding: 15px 20px;
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: auto;
            }

            .table-container {
                padding: 0 20px 20px;
            }

            th, td {
                padding: 8px 6px;
                font-size: 12px;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }

            .modal-header,
            .modal-body,
            .modal-footer {
                padding: 20px;
            }

            .stats {
                flex-direction: column;
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚛 Система управления транспортом</h1>
            <p>Управление транспортными средствами и поставками</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск по всем полям...">
            </div>
            <button class="btn btn-primary" onclick="openAddModal()">
                ➕ Добавить запись
            </button>
            <button class="btn btn-success" onclick="exportData()">
                📊 Экспорт данных
            </button>
            <button class="btn btn-danger" onclick="clearAllData()">
                🗑️ Очистить все
            </button>
        </div>

        <div class="stats" id="statsContainer">
            <!-- Статистика будет загружена динамически -->
        </div>

        <div class="table-container">
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Загрузка данных...</p>
            </div>
            
            <table id="dataTable" style="display: none;">
                <thead>
                    <tr>
                        <th class="sortable" onclick="sortTable(0)">Локация</th>
                        <th class="sortable" onclick="sortTable(1)">№ ТС</th>
                        <th class="sortable" onclick="sortTable(2)">Очередь</th>
                        <th class="sortable" onclick="sortTable(3)">Статус</th>
                        <th class="sortable" onclick="sortTable(4)">ФИО</th>
                        <th class="sortable" onclick="sortTable(5)">Телефон</th>
                        <th class="sortable" onclick="sortTable(6)">Поставщик</th>
                        <th class="sortable" onclick="sortTable(7)">Титул</th>
                        <th class="sortable" onclick="sortTable(8)">Время приб</th>
                        <th class="sortable" onclick="sortTable(9)">Время уб-я</th>
                        <th class="sortable" onclick="sortTable(10)">№ ТН</th>
                        <th class="sortable" onclick="sortTable(11)">Комментарии</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Данные будут загружены динамически -->
                </tbody>
            </table>

            <div class="empty-state" id="emptyState" style="display: none;">
                <h3>📋 Нет данных</h3>
                <p>Добавьте первую запись, чтобы начать работу</p>
                <button class="btn btn-primary" onclick="openAddModal()" style="margin-top: 20px;">
                    ➕ Добавить запись
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить запись</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="dataForm">
                    <div class="form-group">
                        <label for="location">Локация *</label>
                        <input type="text" id="location" required>
                    </div>
                    <div class="form-group">
                        <label for="vehicleNumber">№ ТС *</label>
                        <input type="text" id="vehicleNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="queue">Очередь</label>
                        <input type="number" id="queue" min="1">
                    </div>
                    <div class="form-group">
                        <label for="status">Статус *</label>
                        <select id="status" required>
                            <option value="">Выберите статус</option>
                            <option value="active">Активный</option>
                            <option value="pending">Ожидание</option>
                            <option value="completed">Завершен</option>
                            <option value="cancelled">Отменен</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fullName">ФИО *</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Телефон *</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="supplier">Поставщик</label>
                        <input type="text" id="supplier">
                    </div>
                    <div class="form-group">
                        <label for="title">Титул</label>
                        <input type="text" id="title">
                    </div>
                    <div class="form-group">
                        <label for="arrivalTime">Время прибытия</label>
                        <input type="datetime-local" id="arrivalTime">
                    </div>
                    <div class="form-group">
                        <label for="departureTime">Время убытия</label>
                        <input type="datetime-local" id="departureTime">
                    </div>
                    <div class="form-group">
                        <label for="tnNumber">№ ТН</label>
                        <input type="text" id="tnNumber">
                    </div>
                    <div class="form-group">
                        <label for="comments">Комментарии</label>
                        <textarea id="comments" placeholder="Дополнительная информация..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeModal()">Отмена</button>
                <button class="btn btn-success" onclick="saveData()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let transportData = [];
        let currentEditIndex = -1;
        let sortColumn = -1;
        let sortDirection = 'asc';

        // Инициализация приложения
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            setupEventListeners();
            updateStats();
        });

        // Настройка обработчиков событий
        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', filterData);
            document.getElementById('modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
        }

        // Загрузка данных из localStorage
        function loadData() {
            const saved = localStorage.getItem('transportData');
            if (saved) {
                transportData = JSON.parse(saved);
            } else {
                // Добавляем примеры данных
                transportData = [
                    {
                        location: "Склад А",
                        vehicleNumber: "А123БВ77",
                        queue: 1,
                        status: "active",
                        fullName: "Иванов Иван Иванович",
                        phone: "+7 (999) 123-45-67",
                        supplier: "ООО Поставщик 1",
                        title: "Водитель",
                        arrivalTime: "2024-01-15T10:30",
                        departureTime: "",
                        tnNumber: "ТН-001",
                        comments: "Груз готов к погрузке"
                    },
                    {
                        location: "Склад Б",
                        vehicleNumber: "В456ГД78",
                        queue: 2,
                        status: "pending",
                        fullName: "Петров Петр Петрович",
                        phone: "+7 (999) 234-56-78",
                        supplier: "ООО Поставщик 2",
                        title: "Водитель",
                        arrivalTime: "",
                        departureTime: "",
                        tnNumber: "ТН-002",
                        comments: "Ожидает разгрузки"
                    }
                ];
                saveData();
            }
            renderTable();
            updateStats();
        }

        // Сохранение данных в localStorage
        function saveData() {
            localStorage.setItem('transportData', JSON.stringify(transportData));
        }

        // Отображение таблицы
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const table = document.getElementById('dataTable');
            const emptyState = document.getElementById('emptyState');
            const loading = document.getElementById('loadingIndicator');

            loading.style.display = 'none';

            if (transportData.length === 0) {
                table.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            table.style.display = 'table';
            emptyState.style.display = 'none';

            tbody.innerHTML = transportData.map((item, index) => `
                <tr>
                    <td>${item.location}</td>
                    <td>${item.vehicleNumber}</td>
                    <td>${item.queue || '-'}</td>
                    <td><span class="status ${item.status}">${getStatusText(item.status)}</span></td>
                    <td>${item.fullName}</td>
                    <td>${item.phone}</td>
                    <td>${item.supplier || '-'}</td>
                    <td>${item.title || '-'}</td>
                    <td>${item.arrivalTime ? formatDateTime(item.arrivalTime) : '-'}</td>
                    <td>${item.departureTime ? formatDateTime(item.departureTime) : '-'}</td>
                    <td>${item.tnNumber || '-'}</td>
                    <td>${item.comments || '-'}</td>
                    <td>
                        <button class="btn btn-primary" onclick="editRecord(${index})" style="padding: 6px 12px; font-size: 12px; margin-right: 5px;">
                            ✏️
                        </button>
                        <button class="btn btn-danger" onclick="deleteRecord(${index})" style="padding: 6px 12px; font-size: 12px;">
                            🗑️
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Получение текста статуса
        function getStatusText(status) {
            const statusMap = {
                'active': 'Активный',
                'pending': 'Ожидание',
                'completed': 'Завершен',
                'cancelled': 'Отменен'
            };
            return statusMap[status] || status;
        }

        // Форматирование даты и времени
        function formatDateTime(dateTimeString) {
            if (!dateTimeString) return '-';
            const date = new Date(dateTimeString);
            return date.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Обновление статистики
        function updateStats() {
            const statsContainer = document.getElementById('statsContainer');
            const total = transportData.length;
            const active = transportData.filter(item => item.status === 'active').length;
            const pending = transportData.filter(item => item.status === 'pending').length;
            const completed = transportData.filter(item => item.status === 'completed').length;

            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${total}</div>
                    <div class="stat-label">Всего записей</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${active}</div>
                    <div class="stat-label">Активных</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${pending}</div>
                    <div class="stat-label">Ожидание</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${completed}</div>
                    <div class="stat-label">Завершенных</div>
                </div>
            `;
        }

        // Открытие модального окна для добавления
        function openAddModal() {
            currentEditIndex = -1;
            document.getElementById('modalTitle').textContent = 'Добавить запись';
            document.getElementById('dataForm').reset();
            document.getElementById('modal').style.display = 'block';
        }

        // Редактирование записи
        function editRecord(index) {
            currentEditIndex = index;
            const item = transportData[index];
            
            document.getElementById('modalTitle').textContent = 'Редактировать запись';
            document.getElementById('location').value = item.location;
            document.getElementById('vehicleNumber').value = item.vehicleNumber;
            document.getElementById('queue').value = item.queue || '';
            document.getElementById('status').value = item.status;
            document.getElementById('fullName').value = item.fullName;
            document.getElementById('phone').value = item.phone;
            document.getElementById('supplier').value = item.supplier || '';
            document.getElementById('title').value = item.title || '';
            document.getElementById('arrivalTime').value = item.arrivalTime || '';
            document.getElementById('departureTime').value = item.departureTime || '';
            document.getElementById('tnNumber').value = item.tnNumber || '';
            document.getElementById('comments').value = item.comments || '';
            
            document.getElementById('modal').style.display = 'block';
        }

        // Сохранение данных
        function saveData() {
            const form = document.getElementById('dataForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const formData = {
                location: document.getElementById('location').value.trim(),
                vehicleNumber: document.getElementById('vehicleNumber').value.trim(),
                queue: parseInt(document.getElementById('queue').value) || null,
                status: document.getElementById('status').value,
                fullName: document.getElementById('fullName').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                supplier: document.getElementById('supplier').value.trim(),
                title: document.getElementById('title').value.trim(),
                arrivalTime: document.getElementById('arrivalTime').value,
                departureTime: document.getElementById('departureTime').value,
                tnNumber: document.getElementById('tnNumber').value.trim(),
                comments: document.getElementById('comments').value.trim()
            };

            if (currentEditIndex === -1) {
                transportData.push(formData);
            } else {
                transportData[currentEditIndex] = formData;
            }

            saveData();
            renderTable();
            updateStats();
            closeModal();
        }

        // Удаление записи
        function deleteRecord(index) {
            if (confirm('Вы уверены, что хотите удалить эту запись?')) {
                transportData.splice(index, 1);
                saveData();
                renderTable();
                updateStats();
            }
        }

        // Закрытие модального окна
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Поиск и фильтрация
        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        }

        // Сортировка таблицы
        function sortTable(columnIndex) {
            if (sortColumn === columnIndex) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = columnIndex;
                sortDirection = 'asc';
            }

            const headers = document.querySelectorAll('th');
            headers.forEach((header, index) => {
                header.classList.remove('sort-asc', 'sort-desc');
                if (index === columnIndex) {
                    header.classList.add(sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });

            transportData.sort((a, b) => {
                const aVal = getColumnValue(a, columnIndex);
                const bVal = getColumnValue(b, columnIndex);
                
                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderTable();
        }

        // Получение значения колонки для сортировки
        function getColumnValue(item, columnIndex) {
            const columns = ['location', 'vehicleNumber', 'queue', 'status', 'fullName', 'phone', 'supplier', 'title', 'arrivalTime', 'departureTime', 'tnNumber', 'comments'];
            const value = item[columns[columnIndex]];
            
            if (columnIndex === 2) { // Очередь - числовое значение
                return value || 0;
            }
            if (columnIndex === 8 || columnIndex === 9) { // Время - дата
                return value ? new Date(value) : new Date(0);
            }
            
            return (value || '').toString().toLowerCase();
        }

        // Экспорт данных
        function exportData() {
            const csvContent = generateCSV();
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `transport_data_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Генерация CSV
        function generateCSV() {
            const headers = ['Локация', '№ ТС', 'Очередь', 'Статус', 'ФИО', 'Телефон', 'Поставщик', 'Титул', 'Время приб', 'Время уб-я', '№ ТН', 'Комментарии'];
            const csvRows = [headers.join(',')];
            
            transportData.forEach(item => {
                const row = [
                    `"${item.location}"`,
                    `"${item.vehicleNumber}"`,
                    item.queue || '',
                    `"${getStatusText(item.status)}"`,
                    `"${item.fullName}"`,
                    `"${item.phone}"`,
                    `"${item.supplier || ''}"`,
                    `"${item.title || ''}"`,
                    `"${item.arrivalTime ? formatDateTime(item.arrivalTime) : ''}"`,
                    `"${item.departureTime ? formatDateTime(item.departureTime) : ''}"`,
                    `"${item.tnNumber || ''}"`,
                    `"${item.comments || ''}"`
                ];
                csvRows.push(row.join(','));
            });
            
            return csvRows.join('\n');
        }

        // Очистка всех данных
        function clearAllData() {
            if (confirm('Вы уверены, что хотите удалить ВСЕ данные? Это действие нельзя отменить!')) {
                transportData = [];
                saveData();
                renderTable();
                updateStats();
                document.getElementById('searchInput').value = '';
            }
        }
    </script>
</body>
</html>
